<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add/Edit Student - Techora EduFee</title>
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/students.css">
  <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
</head>
<body>
  <div id="app-container">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <header class="top-bar">
        <div>
          <h1 id="form-title">Register New Student</h1>
          <p style="color: var(--text-muted); font-size: 0.9rem;">Fill out student details below to finalize enrollment.</p>
        </div>
        <button class="btn btn-secondary" onclick="window.history.back()">
          <i class="fa-solid fa-arrow-left"></i> Back
        </button>
      </header>

      <section class="glass-card">
        <form id="student-form" enctype="multipart/form-data">
          <div class="photo-upload-container" style="margin-bottom: 32px; border-bottom: 1px solid var(--border-color); padding-bottom: 24px;">
            <img src="../assets/images/default-avatar.svg" alt="Preview" class="photo-preview" id="upload-preview">
            <div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-start;">
              <span class="form-label">Profile Photo <span style="font-weight: normal; color: var(--text-muted); font-size: 0.8rem;">(Optional)</span></span>
              
              <label class="custom-file-upload btn btn-secondary" style="padding: 8px 16px; font-size: 0.85rem; border-radius: 12px; margin: 0; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; border: 1px solid var(--border-color); background: var(--bg-secondary);">
                <i class="fa-solid fa-cloud-arrow-up" style="color: var(--color-primary);"></i>
                <span id="upload-btn-text">Choose Image</span>
                <input type="file" id="photo" name="photo" accept="image/*" style="display: none;">
              </label>

              <span style="font-size: 0.75rem; color: var(--text-muted);">Allowed formats: JPG, PNG, WEBP. Max size: 2MB.</span>
            </div>
          </div>

          <div class="form-sections-container">
            <div style="display: flex; flex-direction: column; gap: 32px;">
              <!-- Section 1: Basic Information -->
              <div class="form-section">
              <h3 class="form-section-title"><i class="fa-solid fa-user"></i> Basic Information</h3>
              <div class="form-grid-2">
                <div class="form-group" style="grid-column: span 2;">
                  <label for="name" class="form-label">Full Name *</label>
                  <input type="text" id="name" name="name" class="form-control" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                  <label for="parentName" class="form-label">Parent / Guardian Name *</label>
                  <input type="text" id="parentName" name="parentName" class="form-control" placeholder="Robert Doe" required>
                </div>

                <div class="form-group">
                  <label for="whatsappNumber" class="form-label">WhatsApp Number *</label>
                  <input type="tel" id="whatsappNumber" name="whatsappNumber" class="form-control" placeholder="e.g. +919876543210" required>
                </div>

                <div class="form-group" style="grid-column: span 2;">
                  <label for="address" class="form-label">Home Address</label>
                  <textarea id="address" name="address" class="form-control" rows="3" placeholder="123 Street Name, Area, City"></textarea>
                </div>
              </div>
              </div>

              <!-- Section 3: Notification Details -->
              <div class="form-section">
                <h3 class="form-section-title"><i class="fa-solid fa-envelope"></i> Notification Details</h3>
                <div class="form-grid-2">
                  <div class="form-group" style="grid-column: span 2;">
                    <label for="email" class="form-label">Email Address *</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="For sharing student details automatically" required>
                  </div>
                </div>
              </div>
            </div>

            <!-- Section 2: Academic Details -->
            <div class="form-section">
              <h3 class="form-section-title"><i class="fa-solid fa-graduation-cap"></i> Academic Details</h3>
              <div class="form-grid-2">
                <div class="form-group">
                  <label for="studentId" class="form-label">Student ID / Roll No *</label>
                  <input type="text" id="studentId" name="studentId" class="form-control" placeholder="e.g. STU1001" required>
                </div>

                <div class="form-group">
                  <label for="admissionDate" class="form-label">Admission Date</label>
                  <input type="date" id="admissionDate" name="admissionDate" class="form-control">
                </div>

                <div class="form-group">
                  <label for="class" class="form-label">Class *</label>
                  <select id="class" name="class" class="form-control" required>
                    <option value="">Loading classes...</option>
                  </select>
                </div>

                <div class="form-group">
                  <label for="batch" class="form-label">Batch *</label>
                  <select id="batch" name="batch" class="form-control" required disabled>
                    <option value="">Select Class First...</option>
                  </select>
                </div>

                <div class="form-group" id="student-stream-group" style="display: none;">
                  <label for="student-stream" class="form-label">Stream *</label>
                  <select id="student-stream" class="form-control">
                    <option value="">Select Stream...</option>
                    <option value="Science">Science</option>
                    <option value="Commerce">Commerce</option>
                    <option value="Humanities">Humanities</option>
                  </select>
                </div>

                <div class="form-group" style="grid-column: span 2;">
                  <label for="school" class="form-label">School Name</label>
                  <input type="text" id="school" name="school" class="form-control" placeholder="Saint Mary High School">
                </div>

                <div class="form-group" style="grid-column: span 2;">
                  <label class="form-label">Subjects <span style="font-weight: normal; color: var(--text-muted); font-size: 0.8rem;">(Optional)</span></label>
                  <div class="subjects-pill-group">
                    <label class="subject-pill">
                      <input type="checkbox" value="Mathematics" class="subject-checkbox">
                      <span>Mathematics</span>
                    </label>
                    <label class="subject-pill">
                      <input type="checkbox" value="Physics" class="subject-checkbox">
                      <span>Physics</span>
                    </label>
                    <label class="subject-pill">
                      <input type="checkbox" value="Chemistry" class="subject-checkbox">
                      <span>Chemistry</span>
                    </label>
                    <label class="subject-pill">
                      <input type="checkbox" value="Biology" class="subject-checkbox">
                      <span>Biology</span>
                    </label>
                    <label class="subject-pill">
                      <input type="checkbox" value="Science" class="subject-checkbox">
                      <span>Science</span>
                    </label>
                    <label class="subject-pill">
                      <input type="checkbox" value="English" class="subject-checkbox">
                      <span>English</span>
                    </label>
                    <label class="subject-pill">
                      <input type="checkbox" value="Computer Science" class="subject-checkbox">
                      <span>Computer Science</span>
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div style="margin-top: 32px; display: flex; justify-content: flex-end; gap: 16px;">
            <button type="button" class="btn btn-secondary" onclick="window.history.back()">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Student Record</button>
          </div>
        </form>
      </section>

      <footer>
        <p>Powered by <a href="https://techora.in" class="footer-brand" target="_blank">Techora</a></p>
        <p>&copy; 2026 Techora. All rights reserved.</p>
      </footer>
    </main>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/students.js"></script>
</body>
</html>
