<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Techora EduFee</title>
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="particles-container" id="particles-js"></div>
  
  <div class="login-wrapper">
    <div class="glass-card login-card">
      <div class="brand-section">
        <div class="brand-logo">T</div>
        <div class="brand-name">Techora <span style="color: var(--color-primary)">EduFee</span></div>
      </div>
      
      <p class="login-subtitle">Smart Education Management Platform</p>
      
      <div id="error-message" class="error-banner" style="display: none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-icon-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input type="email" id="email" class="form-control" placeholder="name@techora.in" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          </div>
        </div>

        <div class="form-actions">
          <label class="remember-me">
            <input type="checkbox" id="remember-me"> Remember me
          </label>
          <a href="#" class="forgot-password" onclick="alert('Demo Mode: Default login is admin@techora.in / admin123')">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          Login Account <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="login-footer">
        <p>Powered by <a href="https://techora.in" target="_blank">Techora</a></p>
      </div>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
