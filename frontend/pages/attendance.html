<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance - Techora EduFee</title>
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div id="app-container">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <header class="top-bar">
        <div>
          <h1>Student Attendance Sheet</h1>
          <p style="color: var(--text-muted); font-size: 0.9rem;">Mark daily class attendances, log present rates, and track statistics.</p>
        </div>
      </header>

      <!-- Batch Filter Panel -->
      <section class="glass-card" style="display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; position: relative; z-index: 10;">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="att-date" class="form-label">Date *</label>
          <input type="date" id="att-date" class="form-control" style="width: 240px;">
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label for="att-class" class="form-label">Class *</label>
          <select id="att-class" class="form-control" style="width: 240px;">
            <option value="Class 8">Class 8</option>
            <option value="Class 9">Class 9</option>
            <option value="Class 10">Class 10</option>
            <option value="Plus One Science">Plus One Science</option>
            <option value="Plus One Commerce">Plus One Commerce</option>
            <option value="Plus One Humanities">Plus One Humanities</option>
            <option value="Plus Two Science">Plus Two Science</option>
            <option value="Plus Two Commerce">Plus Two Commerce</option>
            <option value="Plus Two Humanities">Plus Two Humanities</option>
          </select>
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label for="att-batch" class="form-label">Batch *</label>
          <select id="att-batch" class="form-control" style="width: 240px;">
            <option value="">Loading batches...</option>
          </select>
        </div>

        <button class="btn btn-primary" onclick="loadAttendanceSheet()">
          <i class="fa-solid fa-arrows-rotate"></i> Load Attendance Sheet
        </button>

        <button class="btn btn-secondary" onclick="copyShareableLink()" id="copy-link-btn" title="Copy Direct Attendance Link for this Batch">
          <i class="fa-solid fa-link"></i> Copy Quick Link
        </button>
      </section>

      <!-- Attendance List -->
      <section class="glass-card" id="sheet-card" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
          <h3 class="section-title" style="margin-bottom: 0;">Attendance Checklist</h3>
          <div style="display: flex; gap: 12px;">
            <button class="btn btn-secondary" onclick="markAllStatus('Present')">Mark All Present</button>
            <button class="btn btn-secondary" onclick="markAllStatus('Absent')">Mark All Absent</button>
          </div>
        </div>

        <div class="table-container" style="margin-bottom: 24px;">
          <table class="premium-table">
            <thead>
              <tr>
                <th>Student ID</th>
                <th>Student Name</th>
                <th style="text-align: center;">Attendance Attempts (Rate)</th>
                <th style="width: 250px; text-align: center;">Status (Present / Absent)</th>
              </tr>
            </thead>
            <tbody id="attendance-list-body">
              <!-- Checklist populated here -->
            </tbody>
          </table>
        </div>

        <div style="display: flex; justify-content: flex-end;">
          <button class="btn btn-primary" id="save-attendance-btn" onclick="saveAttendance()">
            <i class="fa-regular fa-floppy-disk"></i> Save Attendance Sheet
          </button>
        </div>
      </section>

      <footer>
        <p>Powered by <a href="https://techora.in" class="footer-brand" target="_blank">Techora</a></p>
        <p>&copy; 2026 Techora. All rights reserved.</p>
      </footer>
    </main>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/attendance.js"></script>
</body>
</html>
